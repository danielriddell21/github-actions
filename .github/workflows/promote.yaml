name: Promote Release

# Reusable promote: retag the released image as latest, then pin the new
# version into the GitOps manifests repo.

on:
  workflow_call:
    inputs:
      image:
        description: Image name under ghcr.io/<owner>/. Defaults to the calling repo's name.
        type: string
        default: ""
      registry:
        description: Container registry.
        type: string
        default: ghcr.io
      manifests-repo:
        description: Repository holding the deployment manifests.
        type: string
        default: danielriddell21/riddellious-dev
      manifests-ref:
        description: Branch of the manifests repo to update.
        type: string
        default: trunk
      manifests-path:
        description: Path within the manifests repo to stage.
        type: string
        default: manifests/
    secrets:
      manifests-token:
        description: PAT with write access to the manifests repo.
        required: true

# Permissions are declared by each caller on the calling job, since a called
# workflow's permissions are capped by the caller's.

jobs:
  retag:
    name: Retag image
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image != '' && inputs.image || github.event.repository.name }}
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag as latest
        run: |
          docker pull "${IMAGE}:${VERSION}"
          docker tag  "${IMAGE}:${VERSION}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"

  update-manifests:
    name: Pin version in manifests
    needs: retag
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image != '' && inputs.image || github.event.repository.name }}
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.manifests-repo }}
          ref: ${{ inputs.manifests-ref }}
          token: ${{ secrets.manifests-token }}

      - name: Update image tag in deployments
        run: |
          find . -name "deployment.yaml" \
            -exec sed -i "s|${IMAGE}:.*|${IMAGE}:${VERSION}|g" {} \;

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.manifests-path }}"
          git diff --staged --quiet || git commit -m "chore: deploy ${{ inputs.image != '' && inputs.image || github.event.repository.name }} ${VERSION}"
          git push
