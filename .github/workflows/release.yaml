name: Release

# Reusable letsgo release, driven by a v* tag push in the calling repo.
#
# What a release builds is the calling repository's letsgo.mod, not an input
# here: the target matrix, the archive contents, the tap and the container
# image are build inputs, and a build input belongs in the repository it
# describes, pinned by the same commit as the source it builds.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner. ubuntu is enough for every target, since letsgo builds pure
          Go and a darwin binary cross-compiles from Linux.
        type: string
        default: ubuntu-latest
      go-version-file:
        description: >-
          File the Go version is read from. A file rather than a version,
          because the compiler changes the bytes: it is a build input, and
          go.mod is where the repository already records which one it releases
          with.
        type: string
        default: go.mod
      letsgo-version:
        description: >-
          letsgo release to run, as a tag or "latest".

          Floating by default, so that a letsgo release does not need a
          change here and a tag move to reach the repositories that use it.
          The cost is real and worth naming: letsgo decides the archive
          layout and the linker flags, so two releases of one commit built
          by two letsgo versions can differ. Pin it to a tag for a
          repository where rebuilding an old release has to produce the old
          bytes.
        type: string
        default: latest
      plugins:
        description: >-
          Whitespace-separated letsgo plugins to install before the release,
          such as "letsgo-env letsgo-multi". Each is pinned by digest in the
          calling repository's letsgo.mod; this only puts them on PATH.
        type: string
        default: ""
      plugins-version:
        description: >-
          letsgo-plugins release the plugins are installed from.

          A cask needs v0.3.0 or later: that is where letsgo-cask gained the
          --tap flag it publishes through, rather than committing from a
          checkout.
        type: string
        default: v0.3.0
      homebrew-tap:
        description: >-
          Mint a GitHub App token with write access to the tap. Needed when
          letsgo.mod carries a brew directive, or when a cask is written below.
        type: boolean
        default: true
      tap-repository:
        description: Repository the tap token is scoped to.
        type: string
        default: homebrew-tap

      attest:
        description: >-
          Attest build provenance for the archives in dist/. The attestation
          is signed with a short-lived identity minted for the run, so there
          is no key to store and none to rotate; what it establishes is the
          workflow, repository and commit that produced the bytes, which is
          the one thing rebuilding them cannot.

          Off by default only because a called workflow's permissions are
          capped by the caller's: the calling job has to grant `id-token:
          write` and `attestations: write` first, and turning this on without
          them fails the release rather than skipping the step.
        type: boolean
        default: false

      # The cask.
      #
      # letsgo writes formulas, not casks, and a variant is where the two part
      # company: the headless build belongs in a formula and the windowed one
      # in a cask. letsgo-cask reads the release that was just published and
      # writes it, so it takes no part in the build and there is nothing for it
      # to pin.
      cask-name:
        description: >-
          Cask token to write, which is the name people install. Empty means no
          cask, which is every repository that ships one build.
        type: string
        default: ""
      cask-variant:
        description: >-
          Variant whose archives the cask installs, as named in letsgo.mod.
          Empty means the release's own archives.
        type: string
        default: ""
      cask-desc:
        description: >-
          One line describing the cask. Separate from the formula's, because
          they describe different things: a window and a command.
        type: string
        default: ""
      cask-license:
        description: SPDX licence for the cask.
        type: string
        default: MIT
      cask-caveats:
        description: Caveats block, for what somebody has to know before installing.
        type: string
        default: ""
    secrets:
      tap-app-private-key:
        description: >-
          Private key of the GitHub App that publishes to the tap. Scope the
          App's installation to the tap and nothing else: the release itself is
          published with the workflow token, so the App needs no access to the
          repository being released.
        required: false
      otel-auth-token:
        description: Passed through to the release as OTEL_AUTH_TOKEN.
        required: false

# Permissions are declared by each caller on the calling job, since a called
# workflow's permissions are capped by the caller's.

jobs:
  release:
    name: letsgo
    runs-on: ${{ inputs.runs-on }}
    steps:
      # Deliberately no fetch-depth: 0. letsgo reads the history from the API
      # when a shallow clone does not have what the changelog needs, so making
      # every release fetch everything would buy nothing. fetch-tags is still
      # needed: the tag being released has to be present for letsgo to read the
      # version from it.
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          check-latest: false

      # letsgo installs its own plugins, so it has to be here before them.
      # command: "" installs and runs nothing; the release step below is the
      # same action again, by then already on PATH.
      - uses: danielriddell21/letsgo-action@v1
        if: ${{ inputs.plugins != '' }}
        with:
          version: ${{ inputs.letsgo-version }}
          command: ""

      # Plugins are put on PATH, nothing more. letsgo checks each against the
      # digest its letsgo.mod pins before running it, so installing the wrong
      # one fails the release rather than quietly changing it.
      #
      # `letsgo plugin install` rather than curl: it checks the archive
      # against the release's own manifest, and the executable inside the
      # archive against the manifest too, where the recipe it replaces
      # fetched over TLS and trusted whatever came back.
      - name: Install plugins
        if: ${{ inputs.plugins != '' }}
        env:
          PLUGINS: ${{ inputs.plugins }}
          VERSION: ${{ inputs.plugins-version }}
          LETSGO_VERSION: ${{ inputs.letsgo-version }}
        run: |
          set -euo pipefail

          # The plugin command arrived in letsgo v0.9.0. A repository pinned
          # below that still has to be able to release, so say what is
          # missing and fall back, rather than fail on a subcommand that does
          # not exist.
          if letsgo plugin help >/dev/null 2>&1; then
            for plugin in ${PLUGINS}; do
              letsgo plugin install "${plugin}@${VERSION}"
            done
            exit 0
          fi

          echo "::warning::letsgo ${LETSGO_VERSION} has no plugin command, which needs v0.9.0 or later; falling back to an unverified download"

          base="https://github.com/danielriddell21/letsgo-plugins/releases/download/${VERSION}"
          for plugin in ${PLUGINS}; do
            curl --proto '=https' --tlsv1.2 -fsSL \
              "${base}/${plugin}_${VERSION#v}_linux_amd64.tar.gz" \
              | sudo tar -xz -C /usr/local/bin "${plugin}"
          done

      # A workflow token cannot write to another repository, so a tap needs an
      # App token scoped to it. vars resolves against the calling repository,
      # so the App id does not need threading through as an input.
      #
      # Note what repositories does not list: the calling repository. Its
      # release is published with the workflow token, so the App need not be
      # installed there — which is also what stops a new caller from failing
      # its first release with a 404 from the installation lookup for having
      # been left out of one.
      - uses: actions/create-github-app-token@v3
        id: tap-token
        if: ${{ inputs.homebrew-tap }}
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.tap-app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.tap-repository }}

      # Whether the release is a pre-release is letsgo.mod's to say, not this
      # workflow's: it is published that way rather than patched afterwards,
      # and promote.yaml still fires on the `released` event when one is
      # promoted by hand.
      - uses: danielriddell21/letsgo-action@v1
        with:
          version: ${{ inputs.letsgo-version }}

          # The release is this repository's own, so the workflow token
          # publishes it: minted for the run, expiring with it, permissions
          # declared by the caller. The App token goes to the tap alone.
          token: ${{ github.token }}
          tap-token: ${{ steps.tap-token.outputs.token }}
        env:
          OTEL_AUTH_TOKEN: ${{ secrets.otel-auth-token }}
          OTEL_ENDPOINT: ${{ vars.OTEL_ENDPOINT }}

      # Records which workflow built these bytes. Keyed by digest, so it
      # covers the copies already attached to the release.
      - name: Attest provenance
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  cask:
    name: cask
    needs: [release]
    if: ${{ inputs.cask-name != '' }}
    runs-on: ${{ inputs.runs-on }}
    # Only the release job publishes; this writes to the tap with an App token
    # and needs nothing in the calling repository.
    permissions:
      contents: read
    steps:
      - name: Install letsgo-cask
        env:
          VERSION: ${{ inputs.plugins-version }}
        run: |
          set -euo pipefail
          base="https://github.com/danielriddell21/letsgo-plugins/releases/download/${VERSION}"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "${base}/letsgo-cask_${VERSION#v}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin letsgo-cask

      # The manifest the release just published, which carries every archive's
      # digest. Read from the release rather than rebuilt, so the cask can only
      # name bytes that were actually published.
      - name: Fetch the release manifest
        env:
          GH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL -o letsgo.json \
            "https://github.com/${{ github.repository }}/releases/download/${GH_TAG}/letsgo.json"

      - uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.tap-app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.tap-repository }}

      # letsgo-cask writes to the tap itself, through the contents API: one
      # file, no checkout, and a write conditional on the blob it read, so a
      # change that raced this one fails rather than being clobbered. Rendering
      # is deterministic and an identical cask is not committed again, so
      # re-running a release does not churn the tap.
      #
      # No commit identity is set here. The commit is attributed to the App
      # behind the token, which is the same way the formula is attributed —
      # where this step used to hard-code github-actions[bot] and leave a tap's
      # history with two authors for the same kind of change.
      #
      # --token names the cask after the program rather than the archive: the
      # archive carries the variant's suffix to tell two builds apart, and the
      # command somebody types should not depend on which one they installed.
      - name: Publish the cask
        env:
          NAME: ${{ inputs.cask-name }}
          VARIANT: ${{ inputs.cask-variant }}
          DESC: ${{ inputs.cask-desc }}
          LICENSE: ${{ inputs.cask-license }}
          CAVEATS: ${{ inputs.cask-caveats }}
          TAP: ${{ github.repository_owner }}/${{ inputs.tap-repository }}
          LETSGO_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          set -euo pipefail
          letsgo-cask letsgo.json \
            --repo "${GITHUB_REPOSITORY}" \
            --token "${NAME}" \
            --variant "${VARIANT}" \
            --desc "${DESC}" \
            --license "${LICENSE}" \
            --caveats "${CAVEATS}" \
            --tap "${TAP}"
