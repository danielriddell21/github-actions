name: Release

# Reusable GoReleaser release, driven by a v* tag push in the calling repo.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner. Use macos-latest when the release builds a cgo/Metal darwin
          binary, since a Linux clang cannot cross-build one.
        type: string
        default: ubuntu-latest
      go-version:
        description: Go version passed to setup-go.
        type: string
        default: stable
      homebrew-tap:
        description: Mint a GitHub App token with write access to homebrew-tap.
        type: boolean
        default: true
      tap-repository:
        description: Repository the tap token is scoped to.
        type: string
        default: homebrew-tap
      docker-login:
        description: Log in to ghcr.io before running goreleaser.
        type: boolean
        default: false
      qemu-buildx:
        description: Set up QEMU and Buildx, for multi-arch image builds.
        type: boolean
        default: false
      goreleaser-args:
        description: Arguments passed to goreleaser.
        type: string
        default: release --clean
    secrets:
      tap-app-private-key:
        description: Private key of the GitHub App that can write to homebrew-tap.
        required: false
      otel-auth-token:
        description: Passed through to goreleaser as OTEL_AUTH_TOKEN.
        required: false

# Permissions are declared by each caller on the calling job, since a called
# workflow's permissions are capped by the caller's.

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}

      - uses: docker/setup-qemu-action@v4
        if: ${{ inputs.qemu-buildx }}

      - uses: docker/setup-buildx-action@v4
        if: ${{ inputs.qemu-buildx }}

      - uses: docker/login-action@v4
        if: ${{ inputs.docker-login }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # vars resolves against the calling repository, so TAP_APP_ID does not
      # need threading through as an input.
      - uses: actions/create-github-app-token@v3
        id: tap-token
        if: ${{ inputs.homebrew-tap }}
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.tap-app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.tap-repository }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: ${{ inputs.goreleaser-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          OTEL_AUTH_TOKEN: ${{ secrets.otel-auth-token }}
          OTEL_ENDPOINT: ${{ vars.OTEL_ENDPOINT }}
