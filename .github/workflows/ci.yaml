name: CI

# Reusable CI for the Go repos: test, lint, build, mutation test, tag.
# Every job past test can be switched off, so the minimal repos (vet + test
# only) call this same workflow rather than keeping their own copy.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner for every job.
        type: string
        default: ubuntu-latest
      go-version-file:
        description: File to read the Go version from.
        type: string
        default: go.mod
      test-command:
        description: Test command. Prefix with `xvfb-run -a` when the tests need a display.
        type: string
        default: go test -coverprofile=coverage.txt ./...
      build-command:
        description: Build command.
        type: string
        default: go build ./...
      ebiten:
        description: Install the Ebiten system libraries before every job.
        type: boolean
        default: false
      raylib:
        description: Install the raylib system libraries before every job.
        type: boolean
        default: false
      build-tags:
        description: >-
          Build tags applied to `go vet`. Test and build commands are supplied
          whole by the caller, so put the tags in those directly.
        type: string
        default: ""
      vet:
        description: Run `go vet ./...` as part of the test job.
        type: boolean
        default: false
      coverage:
        description: Upload coverage.txt to Codecov.
        type: boolean
        default: true
      build:
        description: Run the build job.
        type: boolean
        default: true
      lint:
        description: Run the golangci-lint job.
        type: boolean
        default: true
      mutate:
        description: Run the gremlins mutation-test job on pushes to the release branch.
        type: boolean
        default: true
      tag:
        description: Run the tag job on pushes to the release branch.
        type: boolean
        default: true
      golangci-config:
        description: golangci-lint config path.
        type: string
        default: .golangci.yml
      golangci-version:
        description: >-
          golangci-lint release to run. Pinned rather than floating: a linter
          that updates underneath you turns a branch red for a commit nobody
          made, which is exactly what happened when this said "latest".
        type: string
        default: v2.13.2
      gremlins-config:
        description: gremlins config path.
        type: string
        default: .gremlins.yaml
      gremlins-version:
        description: gremlins release to run. Pinned for the same reason as golangci-lint.
        type: string
        default: v0.6.0
      release-branch:
        description: Branch that mutation testing and tagging run on.
        type: string
        default: trunk
    secrets:
      codecov-token:
        description: Codecov upload token. Required when coverage is true.
        required: false
      tag-token:
        description: PAT used to push tags, so the tag push retriggers downstream workflows.
        required: false

# Permissions are deliberately not set here. A called workflow's job
# permissions are capped by the calling job's, so declaring them here would
# break any caller that grants less (the repos with tagging switched off).
# Each caller declares what it needs on the calling job.

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - uses: danielriddell21/github-actions/.github/actions/setup-ebiten@v1
        if: ${{ inputs.ebiten }}
        with:
          xvfb: "true"

      - uses: danielriddell21/github-actions/.github/actions/setup-raylib@v1
        if: ${{ inputs.raylib }}
        with:
          xvfb: "true"

      - name: Vet
        if: ${{ inputs.vet }}
        run: go vet ${{ inputs.build-tags && format('-tags {0}', inputs.build-tags) || '' }} ./...

      - name: Test
        run: ${{ inputs.test-command }}

      - name: Upload coverage reports to Codecov
        if: ${{ inputs.coverage }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.codecov-token }}

  lint:
    name: Lint
    if: ${{ inputs.lint }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - uses: danielriddell21/github-actions/.github/actions/setup-ebiten@v1
        if: ${{ inputs.ebiten }}

      - uses: danielriddell21/github-actions/.github/actions/setup-raylib@v1
        if: ${{ inputs.raylib }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-version }}
          args: --config ${{ inputs.golangci-config }}

  build:
    name: Build
    if: ${{ inputs.build }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - uses: danielriddell21/github-actions/.github/actions/setup-ebiten@v1
        if: ${{ inputs.ebiten }}

      - uses: danielriddell21/github-actions/.github/actions/setup-raylib@v1
        if: ${{ inputs.raylib }}

      - name: Build
        run: ${{ inputs.build-command }}

  mutate:
    name: Mutation test
    needs: [test]
    if: ${{ inputs.mutate && github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.release-branch) }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - uses: danielriddell21/github-actions/.github/actions/setup-ebiten@v1
        if: ${{ inputs.ebiten }}
        with:
          start-display: "true"

      - uses: danielriddell21/github-actions/.github/actions/setup-raylib@v1
        if: ${{ inputs.raylib }}
        with:
          start-display: "true"

      - uses: go-gremlins/gremlins-action@v1
        with:
          version: ${{ inputs.gremlins-version }}
          args: --config ${{ inputs.gremlins-config }}

  tag:
    name: Tag
    needs: [test, lint, build]
    # Skipped jobs report `skipped`, not `success`, so an always()-guarded check
    # is needed for the repos that switch lint or build off.
    if: ${{ always() && inputs.tag && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.release-branch) }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Bump version and push tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.tag-token }}
          default_bump: false
          tag_prefix: v
          release_branches: ${{ inputs.release-branch }}
