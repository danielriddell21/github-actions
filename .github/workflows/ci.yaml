name: CI

# Reusable CI for the Go repos: test, lint, build, mutation test, tag.
# Every job past test can be switched off, so the minimal repos (vet + test
# only) call this same workflow rather than keeping their own copy.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner for every job.
        type: string
        default: ubuntu-latest
      go-version-file:
        description: File to read the Go version from.
        type: string
        default: go.mod
      test-command:
        description: Test command. Prefix with `xvfb-run -a` when the tests need a display.
        type: string
        default: go test -coverprofile=coverage.txt ./...
      build-command:
        description: Build command.
        type: string
        default: go build ./...
      ebiten:
        description: Install the Ebiten system libraries before every job.
        type: boolean
        default: false
      raylib:
        description: Install the raylib system libraries before every job.
        type: boolean
        default: false
      build-tags:
        description: >-
          Build tags applied to `go vet`. Test and build commands are supplied
          whole by the caller, so put the tags in those directly.
        type: string
        default: ""
      vet:
        description: Run `go vet ./...` as part of the test job.
        type: boolean
        default: false
      coverage:
        description: Upload coverage.txt to Codecov.
        type: boolean
        default: true
      build:
        description: Run the build job.
        type: boolean
        default: true
      lint:
        description: Run the golangci-lint job.
        type: boolean
        default: true
      mutate:
        description: Run the gremlins mutation-test job on pushes to the release branch.
        type: boolean
        default: true
      tag:
        description: Run the tag job on pushes to the release branch.
        type: boolean
        default: true
      golangci-config:
        description: golangci-lint config path.
        type: string
        default: .golangci.yml
      golangci-version:
        description: >-
          golangci-lint release to run. Pinned rather than floating: a linter
          that updates underneath you turns a branch red for a commit nobody
          made, which is exactly what happened when this said "latest".
        type: string
        default: v2.13.2
      gremlins-config:
        description: gremlins config path.
        type: string
        default: .gremlins.yaml
      gremlins-version:
        description: gremlins release to run. Pinned for the same reason as golangci-lint.
        type: string
        default: v0.6.0
      letsgo-version:
        description: >-
          letsgo release the tag job runs, as a tag or "latest".

          Floating, unlike the linters above: what this decides is a version
          number, not bytes, so a newer letsgo cannot make an old answer
          wrong the way a newer linter can make an old commit red. It can
          only read the commits and the exported API better than the one
          before it.
        type: string
        default: latest
      release-branch:
        description: Branch that mutation testing and tagging run on.
        type: string
        default: trunk
    secrets:
      codecov-token:
        description: Codecov upload token. Required when coverage is true.
        required: false
      tag-token:
        description: >-
          PAT the tag job checks out and pushes with. A tag pushed with the
          workflow token starts no workflow, so the release would never fire.
        required: false

# Permissions are deliberately not set here. A called workflow's job
# permissions are capped by the calling job's, so declaring them here would
# break any caller that grants less (the repos with tagging switched off).
# Each caller declares what it needs on the calling job.

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - uses: danielriddell21/github-actions/.github/actions/setup-ebiten@v2
        if: ${{ inputs.ebiten }}
        with:
          xvfb: "true"

      - uses: danielriddell21/github-actions/.github/actions/setup-raylib@v2
        if: ${{ inputs.raylib }}
        with:
          xvfb: "true"

      - name: Vet
        if: ${{ inputs.vet }}
        run: go vet ${{ inputs.build-tags && format('-tags {0}', inputs.build-tags) || '' }} ./...

      - name: Test
        run: ${{ inputs.test-command }}

      - name: Upload coverage reports to Codecov
        if: ${{ inputs.coverage }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.codecov-token }}

  lint:
    name: Lint
    if: ${{ inputs.lint }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - uses: danielriddell21/github-actions/.github/actions/setup-ebiten@v2
        if: ${{ inputs.ebiten }}

      - uses: danielriddell21/github-actions/.github/actions/setup-raylib@v2
        if: ${{ inputs.raylib }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-version }}
          args: --config ${{ inputs.golangci-config }}

  build:
    name: Build
    if: ${{ inputs.build }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - uses: danielriddell21/github-actions/.github/actions/setup-ebiten@v2
        if: ${{ inputs.ebiten }}

      - uses: danielriddell21/github-actions/.github/actions/setup-raylib@v2
        if: ${{ inputs.raylib }}

      - name: Build
        run: ${{ inputs.build-command }}

  mutate:
    name: Mutation test
    needs: [test]
    if: ${{ inputs.mutate && github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.release-branch) }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - uses: danielriddell21/github-actions/.github/actions/setup-ebiten@v2
        if: ${{ inputs.ebiten }}
        with:
          start-display: "true"

      - uses: danielriddell21/github-actions/.github/actions/setup-raylib@v2
        if: ${{ inputs.raylib }}
        with:
          start-display: "true"

      - uses: go-gremlins/gremlins-action@v1
        with:
          version: ${{ inputs.gremlins-version }}
          args: --config ${{ inputs.gremlins-config }}

  tag:
    name: Tag
    needs: [test, lint, build]
    # Skipped jobs report `skipped`, not `success`, so an always()-guarded check
    # is needed for the repos that switch lint or build off.
    if: ${{ always() && inputs.tag && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.release-branch) }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      # Checked before the clone so a missing secret fails here, saying what is
      # missing, rather than as an unauthenticated checkout further down.
      - name: The token must exist
        env:
          TOKEN: ${{ secrets.tag-token }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::tag-token is not set; a tag pushed with the workflow token starts no release"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # letsgo tag looks for the previous tag and compares this tree's
          # exported API against that one's, so a shallow clone with no tags is
          # not enough.
          fetch-depth: 0

          # A tag pushed with the workflow token starts no workflow, so the
          # release would never fire. A token of its own does.
          token: ${{ secrets.tag-token }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Prepare to tag
        id: prepare
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A commit that already carries a tag has been released. letsgo
          # ignores tags on HEAD when it looks for the previous one, so without
          # this it would propose a second version for the same commit.
          if [ -n "$(git tag --points-at HEAD)" ]; then
            echo "HEAD is already tagged; nothing to do"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # letsgo works out the next version itself. It reads the same
      # conventional commits a tag action would and, where the module has an
      # importable surface, also diffs the exported API against the previous
      # tag — so a removal no commit message confessed to still reaches a
      # major.
      #
      # --warranted: no feat, fix or API change means no release. Without it
      # letsgo falls back to a patch, which is the right answer when a person
      # asks for a version and the wrong one when a documentation commit does.
      - uses: danielriddell21/letsgo-action@v1
        if: ${{ steps.prepare.outputs.proceed == 'true' }}
        with:
          version: ${{ inputs.letsgo-version }}
          command: tag
          args: --yes --warranted

      # letsgo creates the tag and deliberately does not push it: pushing is
      # the one step that cannot be undone, so it belongs to whoever asked.
      - name: Push the tag
        if: ${{ steps.prepare.outputs.proceed == 'true' }}
        run: |
          set -euo pipefail
          tag=$(git tag --points-at HEAD)
          if [ -z "${tag}" ]; then
            echo "nothing was tagged"
            exit 0
          fi
          git push origin "${tag}"
